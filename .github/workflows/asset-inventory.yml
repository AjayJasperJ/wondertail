name: Asset inventory
on:
  push:
    branches: [main]
    paths: ['source_assets/**', '.github/workflows/asset-inventory.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: wondertail-source-assets
          path: source_assets/
          retention-days: 7
